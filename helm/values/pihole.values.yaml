---
DNS1:
  192.168.1.254
persistentVolumeClaim:
  enabled: true
ingress:
  enabled: true
  ingressClassName: nginx-internal
  annotations:
    # the Pi-hole UI lives under /admin/ and the web root answers 403: send / there
    nginx.ingress.kubernetes.io/app-root: /admin/
  hosts:
    - "pihole.home"
serviceWeb:
  loadBalancerIP: 192.168.1.3
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
  type: LoadBalancer
serviceDns:
  loadBalancerIP: 192.168.1.3
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
  type: LoadBalancer
replicaCount: 1
